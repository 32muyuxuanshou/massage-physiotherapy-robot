name: physiotherapy-client

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENV: local-docker
      DEBUG: "false"
      DATABASE_URL: sqlite:///./data/physiotherapy.db
      REDIS_ENABLED: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.docker}
      CORS_ORIGINS: http://127.0.0.1:${APP_PORT:-8080},http://localhost:${APP_PORT:-8080}
      SEED_DEMO_DATA: "true"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend-data:
  backend-uploads:
  backend-logs:
